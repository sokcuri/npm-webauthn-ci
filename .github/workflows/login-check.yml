name: npm login check (self-test)

# Self-test for this repo. Exercises the composite action (./) in login mode and
# the Cloudflare probe in probe mode. Other repos should NOT copy this; they call
# the published action or the reusable workflow instead — see README.
#
#   probe  - no secrets, no login: reports whether Cloudflare blocks this runner.
#   login  - full login via the composite action, on `runs` fresh runners.
#
# Repository secrets:   NPM_PASSWORD, NPM_P256_PRIVATE_KEY
# Repository variables: NPM_USERNAME, NPM_CREDENTIAL_ID

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = Cloudflare check only (no secrets); login = full login test'
        required: true
        default: probe
        type: choice
        options: [probe, login]
      runs:
        description: 'login mode: number of independent runners (1-5)'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3', '5']

permissions:
  contents: read

concurrency:
  group: npm-login-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        with:
          chrome-version: stable
      - name: Runner network
        run: |
          IP="$(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "egress IP: ${IP}"
          curl -s --max-time 10 "https://ipinfo.io/${IP}/org" || true
          echo
      - run: npm ci
      - name: Cloudflare probe
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SPIKE_OUT_DIR: ${{ runner.temp }}/spike-out
        run: node spike-cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-out
          path: ${{ runner.temp }}/spike-out/
          if-no-files-found: warn
          retention-days: 7

  matrix:
    if: inputs.mode == 'login'
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.m.outputs.runs }}
    steps:
      - id: m
        env:
          RUNS: ${{ inputs.runs }}
        run: echo "runs={\"run\":[$(seq -s, 1 ${RUNS})]}" >> "$GITHUB_OUTPUT"

  login:
    if: inputs.mode == 'login'
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.matrix.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Runner network
        run: |
          IP="$(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "egress IP: ${IP}"
          curl -s --max-time 10 "https://ipinfo.io/${IP}/org" || true
          echo
      - name: npm login check (composite action)
        uses: ./
        with:
          npm-username: ${{ vars.NPM_USERNAME }}
          npm-credential-id: ${{ vars.NPM_CREDENTIAL_ID }}
          npm-password: ${{ secrets.NPM_PASSWORD }}
          npm-private-key: ${{ secrets.NPM_P256_PRIVATE_KEY }}
          artifact-name: login-check-run-${{ matrix.run }}
